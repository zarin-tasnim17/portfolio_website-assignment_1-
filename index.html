<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>portfolio website</title>
  </head>
  <body>
    <nav class="nav">
      <div class="logo">
        <img src="./assets/logo-navbar.png" alt="logo" />
      </div>
      <div class="link">
        <a href="#">Features</a>
        <a href="#">How It Works</a>
        <a href="#">Why It's Different</a>
      </div>
      <div class="button">
        <button>Get Early Access</button>
      </div>
    </nav>
    <div class="img-box">
      <div class="box-content">
        <div class="el-1">
          <div class="dot">
            <div class="dot-in"></div>
            <div class="dot-out"></div>
            <div class="out-out"></div>
          </div>
          <p>Early Access Now Open</p>
        </div>
        <div class="el-2">
          <h1 class="col-1">Structured thinking,</h1>
          <h1 class="col-2">Not just note-taking.</h1>
        </div>
        <div class="el-3">
          <p>
            A private space to store notes, links, and learning summaries —
            designed to <br />
            help you think clearly, connect ideas, and turn learning into
            long-term knowledge.
          </p>
        </div>
        <div class="button-body">
          <div class="button-1">
            <div class="color-div">
              <button>Start Building Your Vault</button>
              <img src="./assets/ArrowRight.png" alt="play-png" />
            </div>
          </div>

          <div class="button-2">
            <img src="./assets/play-button.png" alt="arrow-png" />
            <button>See How It Works</button>
          </div>
        </div>
      </div>
      <img src="./assets/hero-bg.png" alt="body img" />
    </div>
  </body>
</html>
